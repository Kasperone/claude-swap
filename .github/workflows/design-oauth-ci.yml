# Branch-only CI for fix/preserve-design-oauth: full suite on Linux and macOS,
# plus the designOauth tests against a REAL macOS Keychain (throwaway keychain,
# password generated per run, fake credentials only).
name: designOauth CI

on:
  push:
    branches: [fix/preserve-design-oauth]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the whole suite
        run: uv run pytest -o faulthandler_timeout=600

      - name: Create temporary keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PW"
          KEYCHAIN="$RUNNER_TEMP/cswap-test.keychain-db"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Search list first, then default: macOS hides a default that is not
          # in the search list.
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "CSWAP_CI_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: designOauth against the real Keychain (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: >
          uv run pytest -o faulthandler_timeout=300 -v -n 0
          tests/test_design_oauth_macos_real.py

      - name: Check cswap's Keychain naming against Claude Code (pinned + latest, macOS)
        if: runner.os == 'macOS'
        env:
          CC_PINNED_VERSION: 2.1.306
        run: |
          # Read-only: `npm pack` only downloads tarballs (no install scripts,
          # no execution, no login); binaries are inspected as bytes. Runs
          # against the pinned version AND the latest published one, so a
          # Claude Code release that changes the credential storage turns this
          # red with the broken expectation named.
          ARCH="$(uname -m | sed 's/x86_64/x64/')"
          PKG="@anthropic-ai/claude-code-darwin-$ARCH"
          LATEST="$(npm view "$PKG" version)"
          echo "pinned=$CC_PINNED_VERSION latest=$LATEST"
          ARGS=()
          for VERSION in "$CC_PINNED_VERSION" "$LATEST"; do
            DIR="$RUNNER_TEMP/cc-$VERSION"
            [ -d "$DIR" ] && continue
            mkdir -p "$DIR/extract"
            (cd "$DIR" && npm pack "$PKG@$VERSION" --silent >/dev/null \
              && tar -xzf ./*.tgz -C extract)
            ARGS+=("$VERSION=$DIR/extract/package/claude")
          done
          uv run python .github/scripts/check_claude_code_keychain.py "${ARGS[@]}"

      - name: Delete temporary keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$CSWAP_CI_KEYCHAIN" || true
